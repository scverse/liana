[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "liana"
description = "LIANA+: a one-stop-shop framework for cell-cell communication"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Daniel Dimitrov", email = "daniel.dimitrov@embl.de" },
]
authors = [
  { name = "Daniel Dimitrov" },
  { name = "Philipp Sven Lars Schäfer" },
  { name = "Elias Farr" },
  { name = "Pablo Rodriguez-Mier" },
  { name = "Sebastian Lobentanzer" },
  { name = "Pau Badia-i-Mompel" },
  { name = "Aurelien Dugourd" },
  { name = "Jovan Tanevski" },
  { name = "Ricardo Omar Ramirez Flores" },
  { name = "Lukas Heumos" },
  { name = "Julio Saez-Rodriguez" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "anndata>=0.13",
  "fast-array-utils",
  "mudata>=0.4",                   # <0.4 cannot write h5mu with anndata>=0.13 (None layer key)
  "numba",
  "pandas",
  "plotnine>=0.10.1",
  "scanpy>=1.12",                  # 1.12 guards `annotate_doc_types` against non-weakref-able TypeAliasType
  "scverse-misc[datasets]>=0.1.4",
  "session-info2",
  "tqdm>=4",
]
optional-dependencies.extras = [
  "cell2cell",
  "corneto==0.9.1a6",
  "cvxpy-base>=1.6.1",
  "decoupler>=2",
  "gseapy>=1.1",
  "kneed>=0.7",
  "mofapy2>=0.7",
  "mofax",
  "muon>=0.1.9",       # <0.1.9 cannot import with mudata>=0.4
  "omnipath>=1.0.6",
  "pydeseq2>=0.3.5",
  "pyscipopt>=5.2.1",
  "squidpy>=1.5",      # backs li.mt.MistyData / spatial_neighbors (lazy-imported)
]
# Runtime deps to execute the tutorial notebooks under docs/notebooks on CPU.
# = extras (liana features) + notebook-only viz/runtime packages not imported by src.
optional-dependencies.tutorials = [
  "adjusttext",
  "graphviz",
  "liana[extras]",
  "marsilea",
  "matplotlib",
  "pycrosstalker",
  "seaborn",
]
# The two heavy notebooks (inflow_mofaflex, liana_c2c): tensor-cell2cell's tensorly
# backend + mofaflex + torch. torch is routed to the CPU wheel index in
# [tool.uv.sources] (CI is CPU-only; point it at a cu124 index when GPU CI lands).
# mofaflex is pinned to git @main there -- the notebook uses the unreleased 0.2.0
# API, absent from PyPI 0.1.2.
#   uv sync --extra tutorials-gpu
optional-dependencies.tutorials-gpu = [
  "liana[tutorials]",
  "mofaflex",
  "tensorly>=0.8",
  "torch",
]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://liana.readthedocs.io/"
urls.Homepage = "https://github.com/scverse/liana-py"
urls.Source = "https://github.com/scverse/liana-py"
scripts.liana-install-skills = "liana._skills.install:main"

[dependency-groups]
dev = [
  "highspy>=1.9",
  "prek",
  "twine>=4.0.2",
]
test = [
  "coverage>=7.10",
  "pytest>=8",
  "pytest-xdist",
]
doc = [
  "docutils>=0.8,!=0.18.*,!=0.19.*",
  "ipykernel",
  "ipython",
  "myst-nb>=1.1",
  "scanpydoc>=0.15.4",
  "setuptools",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinxcontrib-bibtex>=1",
  "sphinxcontrib-katex",
  "sphinxcontrib-mermaid>=0.9",
  "sphinxext-opengraph",
]
typecheck = [
  "mypy>=1.18",
  "pandas-stubs",
  "scipy-stubs",
  "types-networkx",
  "types-requests",
  "types-tqdm",
]

[tool.hatch]
version.source = "vcs"
envs.default.installer = "uv"
envs.default.dependency-groups = [ "dev" ]
envs.docs.features = [ "extras" ]
envs.docs.scripts.build = "sphinx-build -M html docs docs/_build -W {args}"
envs.docs.scripts.clean = "git clean -fdX -- {args:docs}"
envs.docs.scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
envs.docs.dependency-groups = [ "doc" ]
envs.hatch-test.features = [ "extras" ]
envs.hatch-test.matrix = [
  # Test every supported Python version with normal deps
  { deps = [ "stable" ], python = [ "3.12", "3.13", "3.14" ] },
  # Test the newest supported Python version also with pre-release deps
  { deps = [ "pre" ], python = [ "3.14" ] },
]
# If the matrix variable `deps` is set to "pre", set the environment variable `UV_PRERELEASE` to "allow".
envs.hatch-test.overrides.matrix.deps.env-vars = [
  { value = "allow", key = "UV_PRERELEASE", if = [ "pre" ] },
]
envs.hatch-test.dependency-groups = [ "dev", "test" ]
envs.hatch-check-fmt.dependencies = [ "prek" ]
envs.hatch-check-fmt.scripts.format-check = "echo 'try `hatch check fmt --fix`'; false"
envs.hatch-check-fmt.scripts.format-fix = "prek run -a --group=format --no-group=typecheck"
envs.hatch-check-code.dependencies = [ "prek" ]
envs.hatch-check-code.scripts.lint-check = "echo 'try `hatch check code --fix`'; false"
envs.hatch-check-code.scripts.lint-fix = "prek run -a --no-group=format --no-group=typecheck"
envs.hatch-check-types.features = [ "extras" ]
envs.hatch-check-types.scripts.check = [ "mypy" ]
envs.hatch-check-types.dependency-groups = [ "typecheck", "test" ]
envs.doctest.features = [ "extras" ]
envs.doctest.scripts.run = "pytest --doctest-modules src/liana {args}"
# Runs the `>>>` examples in `src/` docstrings.
# Separate from `hatch-test` because it imports every module under `src/` and re-executes each example -- work the unit suite should not pay for.
envs.doctest.dependency-groups = [ "test" ]

[tool.uv]
# inflow_mofaflex.ipynb needs the unreleased 0.2.0 API (terms/priors); PyPI 0.1.2 is incompatible.
# uv-only override -- keeps published metadata PyPI-clean.
sources.mofaflex = { git = "https://github.com/bioFAM/mofaflex.git", branch = "main" }
# CPU torch wheels -- keeps tutorial CI off the ~2.5GB CUDA build.
# Swap the index url for download.pytorch.org/whl/cu124 when GPU CI lands.
sources.torch = { index = "pytorch-cpu" }
index = [ { name = "pytorch-cpu", url = "https://download.pytorch.org/whl/cpu", explicit = true } ]

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]
format.exclude = [ "src/liana/_skills/data/**/*.md" ]  # keep the skill's aligned inline comments
format.docstring-code-format = true
lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008", # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107", # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203", # We don’t want a blank line before a class docstring
  "D213", # <> We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401", # First line should be in imperative mood; try rephrasing
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731", # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names -> I is the identity matrix
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/*" = [ "I" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.flake8-tidy-imports.banned-api."matplotlib.pyplot.show".msg = "return the figure instead; showing is the caller's decision"
lint.pydocstyle.convention = "numpy"

[tool.mypy]
files = [ "src", "tests" ]
# `disallow_untyped_calls` (from `strict`) is about *our* code being annotated; it should not fire for calls into dependencies that simply ship no annotations.
# These are the same packages listed as `follow_untyped_imports` below -- reading them from source still gives their real signatures, only the "is annotated" check is relaxed.
untyped_calls_exclude = [
  "cell2cell",
  "corneto",
  "decoupler",
  "gseapy",
  "joblib",
  "kneed",
  "mofapy2",
  "mofax",
  "mudata",
  "muon",
  "numba",
  "omnipath",
  "plotnine",
  "pooch",
  "pydeseq2",
  "scanpy",
  "sklearn",
  "squidpy",
  "statsmodels",
]
# `strict` implies these, but be explicit about the ones that carry the weight here.
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
]
strict = true

# Dependencies that ship neither inline types nor stubs.
# Rather than collapsing them to `Any` with `ignore_missing_imports`, mypy reads them from source, so their real signatures still constrain our call sites.
# Listing them explicitly (instead of setting this project-wide) keeps a newly-typed dependency from silently staying untyped once it grows a `py.typed`.
[[tool.mypy.overrides]]
module = [
  "cell2cell.*",
  "corneto.*",
  "decoupler.*",
  "gseapy.*",
  "joblib.*",
  "kneed.*",
  "mofapy2.*",
  "mofax.*",
  "mudata.*",
  "muon.*",
  "numba.*",
  "omnipath.*",
  "plotnine.*",
  "pooch.*",
  "pydeseq2.*",
  "scanpy.*",
  "session_info2.*",
  "sklearn.*",
  "squidpy.*",
  # Only the submodules that define what is imported: following the top-level `statsmodels` package (or its `api` shim) trips mypy's "Source file found twice under different module names".
  "statsmodels.regression.*",
  "statsmodels.robust.*",
  "statsmodels.tools.*",
]
follow_untyped_imports = true
# `no_implicit_reexport` (from `strict`) is a rule about *this* package's public surface; third-party packages re-export freely from their `__init__` and should not be held to it.
implicit_reexport = true

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = [
  "--import-mode=importlib", # allow using test files with same name
  "--strict-markers",
]
ini_options.markers = [
  'network: needs internet access; deselect with `-m "not network"`',
]
ini_options.xfail_strict = true
# Applies to the `>>>` examples in `src/` docstrings, collected by the
# `hatch.envs.doctest` script above. Without these, an example breaks whenever a dependency changes
# how it formats a repr, which is what happened to `liana.utils.transform`.
ini_options.doctest_optionflags = [
  "ELLIPSIS",             # `...` to elide float tails and wide frames
  "NORMALIZE_WHITESPACE", # tabs/indent in a repr are not the contract
]

[tool.coverage]
run.source = [ "liana" ]
run.omit = [
  "**/test_*.py",
]
run.patch = [ "subprocess" ]

[tool.cruft]
skip = [
  ".git",
  "tests",
  "src/**/__init__.py",
  "src/**/basic.py",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.ipynb",
]
